services:

  mysql:
    image: mysql:8.0
    container_name: projectfin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: user
      MYSQL_DATABASE: product_fin
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-puser"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: projectfin:1.0
    container_name: projectfin-app
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/product_fin
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: user
    depends_on:
      mysql:
        condition: service_healthy